monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Jieli_Technology_USB_Composite_Device.*"
      }
    ]
    actions = {
      update-props = {
        device.description = "HAYLOU S40 (USB)"
        device.nick = "HAYLOU S40"
        device.icon-name = "audio-headset"
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Jieli_Technology_USB_Composite_Device.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "HAYLOU S40 (USB)"
        node.nick = "HAYLOU S40"
        device.icon-name = "audio-headset"
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Jieli_Technology_USB_Composite_Device.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "HAYLOU S40 Micrófono (USB)"
        node.nick = "HAYLOU S40 Mic"
        device.icon-name = "audio-input-microphone"
      }
    }
  }
]
